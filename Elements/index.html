<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>靈感亂燉鍋｜Jellyfish Lab</title>
    <link rel="stylesheet" href="../CSS/common.css">
    <link rel="stylesheet" href="../CSS/elements.css">
</head>

<body data-page="elements">
    <main class="wrap">
        <h1>🎲 靈感亂燉鍋</h1>
        <p class="subtitle">抽出毫無關聯的元素，剩下的交給想像力（？）</p>

        <section class="panel">
            <div class="mode-options">
                <label class="mode-option">
                    <input type="radio" name="mode" value="random" checked>
                    <strong>完全隨機</strong>
                </label>

                <label class="mode-option">
                    <input type="radio" name="mode" value="custom">
                    <strong>自訂抽取</strong>
                </label>
            </div>

            <!-- 完全隨機設定 -->
            <div class="mode-content" id="randomSettings">
                <div class="controls">
                    <label for="randomCount">總抽取元素數量</label>

                    <select id="randomCount">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>

                <p class="hint">
                    從全部元素自由抽取，不限制分類或主體
                </p>
            </div>

            <!-- 自訂抽取設定 -->
            <div class="mode-content" id="customSettings" hidden>
                <div class="category-head">
                    <span class="hint">設定各分類要抽取的元素數量</span>
                    <button class="secondary" id="clearAll" type="button">
                        全部清除
                    </button>
                </div>

                <div class="categories" id="categories"></div>

                <div class="total">
                    <span>總抽取數量</span>
                    <strong id="customTotal">0 個</strong>
                </div>
            </div>

            <div class="generate-controls">
                <label class="mode-option">
                    <input id="includePalette" type="checkbox" checked>
                    同時抽取色盤
                </label>

                <button class="primary" id="generate" type="button">
                    🎲 重新抽題
                </button>
            </div>
        </section>

        <!-- 抽取結果 -->
        <section class="panel">
            <strong>本次抽取結果</strong>

            <div class="results" id="results" aria-live="polite"></div>

            <!-- 色盤結果 -->
            <div id="paletteSection" class="palette-section" hidden>
                <strong>本次配色</strong>

                <div class="palette-colors" id="paletteColors"></div>

                <div class="hint" id="paletteInfo"></div>
            </div>

            <div class="actions">
                <button class="secondary" id="copyAll" type="button" disabled>
                    複製全部結果
                </button>

                <span id="status" role="status" aria-live="polite">
                    點擊抽取元素開始
                </span>
            </div>
        </section>

    </main>

    <script src="../Shared/outfit-data.js"></script>
    <script src="./data.js"></script>
    <script src="../Shared/palette-engine.js"></script>
    <script src="./app.js"></script>
    <script src="../Shared/layout.js"></script>
</body>

</html>
