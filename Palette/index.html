<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>色票撈撈所｜Jellyfish Lab</title>
    <link rel="stylesheet" href="../CSS/common.css">
    <link rel="stylesheet" href="../CSS/palette.css">
</head>

<body data-page="palette">
    <main class="app">
        <h1>🎨 色票撈撈所</h1>

        <div class="controls">
            <label class="field">
                風格
                <select id="style"></select>
            </label>

            <label class="field">
                配色關係
                <select id="scheme"></select>
            </label>

            <label class="check">
                <input id="fullyRandom" type="checkbox">
                完全隨機
            </label>

            <button class="primary" id="generate" type="button">
                抽色盤
            </button>
        </div>

        <div class="info" id="info"></div>
        <div class="palette" id="palette"></div>

        <div class="footer">
            <div class="status" id="status" role="status" aria-live="polite">
                點擊色票或 HEX 可複製色碼
            </div>
            <button id="copyAll" type="button">複製整組 HEX</button>
        </div>
    </main>

    <script src="../Shared/palette-engine.js"></script>
    <script src="./app.js"></script>
    <script src="../Shared/layout.js"></script>
</body>

</html>
